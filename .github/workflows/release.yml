name: Release
# Bei jedem Push auf main: prüfen, ZIP bauen und – falls für die Version in plugin.cfg
# noch kein Release existiert – Tag "v<Version>" + GitHub-Release mit ZIP anlegen.
# Neue Version: VERSION in release.cfg/prerelease.cfg und CHANGELOG.md anpassen und auf main pushen.
# tools/sync.sh überträgt die Version in plugin.cfg, Dienst und Weboberfläche und erzeugt die Icons.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Altlasten der Express/Vue-Version entfernen (einmalig)
        run: |
          if [ -f tools/legacy-files.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            xargs -a tools/legacy-files.txt git rm -r -q --ignore-unmatch --
            git rm -q tools/legacy-files.txt
            git commit -q -m "Altlasten der Express/Vue-Version entfernt"
            git push origin HEAD:main
          fi
      - name: Ausstehenden Patch einspielen (tools/pending.patch)
        run: |
          if [ -f tools/pending.patch ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git apply --index tools/pending.patch
            git rm -q tools/pending.patch
            git commit -q -m "tools/pending.patch eingespielt"
            git push origin HEAD:main
          fi
      - name: Version, Titel und Icons übernehmen (tools/sync.sh)
        run: |
          command -v rsvg-convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin >/dev/null; }
          V=$(bash tools/sync.sh)
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Version $V in alle Dateien übernommen, Icons erzeugt"
            git push origin HEAD:main
          fi
      - name: Prüfen
        run: bash tools/check.sh
      - name: ZIP bauen
        id: build
        run: |
          echo "zip=$(bash tools/build.sh)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^VERSION=//p' plugin.cfg | head -1)" >> "$GITHUB_OUTPUT"
      - name: Release anlegen (falls noch nicht vorhanden)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V existiert bereits – nichts zu tun"
            exit 0
          fi
          PRE=""
          case "$V" in *-*) PRE="--prerelease" ;; esac
          NOTES=$(awk 'NR==1,/^## / {next} /^## /{exit} {print}' CHANGELOG.md)
          [ -z "$NOTES" ] && NOTES="Siehe CHANGELOG.md"
          gh release create "v$V" "$ZIP" --target "$(git rev-parse HEAD)" \
            --title "Unifi-PresenceNG $V" --notes "$NOTES" $PRE
